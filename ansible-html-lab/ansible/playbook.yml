- hosts: node2-3
  become: true
  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Copy static HTML
      copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head><title>Welcome</title></head>
          <body><h1>Hello from {{ inventory_hostname }}</h1></body>
          </html>

    - name: Ensure Apache is running (for Docker without systemd)
      shell: |
        if ! pgrep apache2 > /dev/null; then
          apache2ctl start
        fi

